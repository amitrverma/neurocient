name: Monorepo CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          API_BASE_URL: http://127.0.0.1:8000

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.4-alpine
        env:
          POSTGRES_DB: neurocient
          POSTGRES_USER: neurocient
          POSTGRES_PASSWORD: neurocient_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neurocient -d neurocient"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://neurocient:neurocient_local@127.0.0.1:5432/neurocient
      ENV: dev
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m alembic upgrade head
      - run: python -m alembic downgrade base
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m pytest -p no:cacheprovider
      - name: PostgreSQL integration
        run: python -m pytest -p no:cacheprovider tests/integration -q
        env:
          RUN_POSTGRES_INTEGRATION: "1"

  backend-image:
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:17.4-alpine
        env:
          POSTGRES_DB: neurocient
          POSTGRES_USER: neurocient
          POSTGRES_PASSWORD: neurocient_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neurocient -d neurocient"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          load: true
          tags: neurocient-backend:${{ github.sha }}
      - name: Verify packaged migrations
        run: >-
          docker run --rm --network host
          -e DATABASE_URL=postgresql+asyncpg://neurocient:neurocient_local@127.0.0.1:5432/neurocient
          -e ENV=dev
          neurocient-backend:${{ github.sha }}
          alembic upgrade head
      - name: Verify packaged migration head
        run: >-
          docker run --rm --network host
          -e DATABASE_URL=postgresql+asyncpg://neurocient:neurocient_local@127.0.0.1:5432/neurocient
          -e ENV=dev
          neurocient-backend:${{ github.sha }}
          alembic current
